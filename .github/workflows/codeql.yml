name: CodeQL

# Advanced setup replaces CodeQL default setup. Default setup autobuilt the
# Swift UI helper on a macOS runner for every pull request (13-23 min). Here the
# Swift analysis builds only tools/macos_ui_helper and runs only when that
# package or this workflow changes, plus a weekly scheduled run. The other
# languages still run on every pull request and push to main.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Swift Changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Scheduled and manual runs always analyze Swift. Pull requests and
          # pushes analyze it only when the helper package or this workflow
          # changed. A push without a usable "before" commit analyzes it too.
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          swift_files=$(git diff --name-only "$base" HEAD -- tools/macos_ui_helper .github/workflows/codeql.yml)
          if [ -n "$swift_files" ]; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
            echo "No macOS UI helper changes: Swift analysis skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - c-cpp
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build macOS UI helper
        run: swift build --package-path tools/macos_ui_helper --product macos-ui-helper

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
