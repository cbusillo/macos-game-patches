name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository metadata
        run: |
          jq empty \
            .github/github.json \
            runtime/bindings.example.json \
            runtime/game-profile.schema.json \
            runtime/manifest.json \
            runtime/manifest.lock.json \
            runtime/profiles/*.json

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            AGENTS.md
            docs/*.md
            docs/**/*.md
            patches/**/*.md

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: "v1.7.12"
        run: |
          package="github.com/rhysd/actionlint/cmd/actionlint"
          go run "${package}@${ACTIONLINT_VERSION}" \
            -config-file .github/actionlint.yaml \
            .github/workflows/ci.yml

      - name: Validate Python tools
        run: |
          python3 -m py_compile \
            tools/vr_stack_cleanup.py \
            tools/launch_freedom_crossover.py \
            tools/build_runtime_artifact.py \
            tools/runtime_profile.py \
            tools/runtime_control.py \
            tools/runtime_cli.py \
            tools/runtime_start.py \
            tools/runtime_control_test.py \
            tools/runtime_start_test.py \
            tools/runtime_descriptor.py \
            tools/runtime_descriptor_test.py \
            tools/runtime_transaction.py \
            tools/runtime_transaction_test.py \
            tools/runtime_install.py \
            tools/runtime_install_test.py

      - name: Validate runtime profiles
        run: |
          python3 tools/runtime_profile.py check
          python3 tools/runtime_profile.py self-test

      - name: Validate runtime control plane
        run: |
          python3 tools/runtime_control_test.py
          python3 tools/runtime_start_test.py
          python3 tools/runtime_cli.py --help

      - name: Validate runtime transactions
        run: |
          python3 tools/runtime_descriptor_test.py
          python3 tools/runtime_transaction_test.py

      - name: Validate runtime lifecycle coordination
        run: python3 tools/runtime_install_test.py

      - name: Validate runtime artifact contract
        run: |
          python3 tools/build_runtime_artifact.py check
          python3 tools/build_runtime_artifact.py self-test

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          checksum_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfLO "$url"
          curl -sSfL "$checksum_url" | grep "  ${archive}$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Secret scan tracked files
        run: gitleaks detect --source . --no-git --redact --verbose

  runtime-lifecycle-macos:
    name: Runtime Lifecycle (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile lifecycle tools
        run: |
          python3 -m py_compile \
            tools/build_runtime_artifact.py \
            tools/runtime_control.py \
            tools/runtime_cli.py \
            tools/runtime_start.py \
            tools/runtime_descriptor.py \
            tools/runtime_transaction.py \
            tools/runtime_install.py \
            tools/runtime_control_test.py \
            tools/runtime_start_test.py \
            tools/runtime_descriptor_test.py \
            tools/runtime_transaction_test.py \
            tools/runtime_install_test.py

      - name: Validate lifecycle fixtures
        run: |
          python3 tools/runtime_control_test.py
          python3 tools/runtime_start_test.py
          python3 tools/runtime_descriptor_test.py
          python3 tools/runtime_transaction_test.py
          python3 tools/runtime_install_test.py
